<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>討伐西瓜籽 🍉</title>

<style>

/* ===== 🌈 可自訂區（你可以改這些） ===== */
:root {
  --bg-color: #f4f1ec;          /* ⭐ 背景顏色 */
  --btn-color: #ff6b6b;         /* ⭐ 按鈕顏色 */
  --btn-text: #ffffff;          /* ⭐ 按鈕文字顏色 */
}

/* ===== 基本 ===== */
body {
  margin: 0;
  font-family: sans-serif;
  background: var(--bg-color);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  min-height: 100vh;
}

/* ===== 標題 ===== */
h2 {
  margin-top: 10px;
}

/* ===== 西瓜區 ===== */
#melon {
  width: 90vw;               /* ⭐ 手機自適應 */
  max-width: 420px;
  aspect-ratio: 1/1;

  position: relative;

  /* ⭐⭐⭐ 換你的「西瓜底圖」 ⭐⭐⭐ */
  background-image: url("https://i.meee.com.tw/FjnTuaO.jpg");

  background-size: cover;
  background-position: center;

  border-radius: 20px;
  overflow: hidden;
}

/* ===== 籽 ===== */
.seed {
  width: 20px;
  height: 26px;

  /* ⭐⭐⭐ 換你的「籽圖片（透明PNG）」 ⭐⭐⭐ */
  background-image: url("https://i.meee.com.tw/r17sw0F.png");

  background-size: contain;
  background-repeat: no-repeat;

  position: absolute;
  cursor: pointer;

  transition: transform 0.2s;
}

/* 點擊動畫 */
.seed.removing {
  animation: pop 0.3s forwards;
}

@keyframes pop {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); }
  100% { transform: scale(0); opacity: 0; }
}

/* ===== UI ===== */
#ui {
  margin-top: 10px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;

  background: var(--btn-color);
  color: var(--btn-text);

  font-size: 16px;
}

</style>
</head>

<body>

<h2>討伐西瓜籽 🍉</h2>

<div id="melon"></div>

<div id="ui">
  <div>⏱ 時間：<span id="time">0.0</span> 秒</div>
  <div>🎯 分數：<span id="score">0</span></div>
  <button onclick="startGame()">重新開始</button>
</div>

<script>

const melon = document.getElementById("melon");
const timeText = document.getElementById("time");
const scoreText = document.getElementById("score");

/* ===== 可調整 ===== */
const TOTAL_SEEDS = 10;   // ⭐ 籽數量

let removed = 0;
let timer = 0;
let interval;

/* ===== 音效（啵） ===== */
const popSound = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_c8b0f9d8f1.mp3");

/* ===== 開始遊戲 ===== */
function startGame() {
  melon.innerHTML = "";
  removed = 0;
  timer = 0;
  scoreText.innerText = 0;

  clearInterval(interval);
  interval = setInterval(() => {
    timer += 0.1;
    timeText.innerText = timer.toFixed(1);
  }, 100);

  generateSeeds();
}

/* ===== 生成籽（隨機 + 不超出） ===== */
function generateSeeds() {
  const size = melon.clientWidth;

  for (let i = 0; i < TOTAL_SEEDS; i++) {
    let seed = document.createElement("div");
    seed.className = "seed";

    let x = Math.random() * (size - 30);
    let y = Math.random() * (size - 30);

    seed.style.left = x + "px";
    seed.style.top = y + "px";

    seed.onclick = () => {
      popSound.currentTime = 0;
      popSound.play();

      seed.classList.add("removing");

      setTimeout(() => seed.remove(), 300);

      removed++;
      scoreText.innerText = removed;

      if (removed === TOTAL_SEEDS) {
        clearInterval(interval);
        alert("🎉 完成！用時：" + timer.toFixed(1) + " 秒");
      }
    };

    melon.appendChild(seed);
  }
}

/* 自動開始 */
startGame();

</script>

</body>
</html>
