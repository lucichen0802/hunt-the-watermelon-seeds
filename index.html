<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>討伐西瓜籽！</title>

<style>
body {
  text-align: center;
  font-family: sans-serif;
}

/* ===== 西瓜底圖 ===== */
#melon {
  width: 320px;
  height: 220px;
  margin: 20px auto;
  position: relative;

  /* ⭐⭐⭐ ① 在這裡換「無籽西瓜圖片」 ⭐⭐⭐ */
  background-image: url("https://i.meee.com.tw/8WJF4zu.png");

  background-size: cover;
  background-position: center;
  border-radius: 12px;
  overflow: hidden;
}

/* ===== 籽 ===== */
.seed {
  width: 16px;
  height: 22px;

  /* ⭐⭐⭐ ② 在這裡換「籽 PNG 圖」 ⭐⭐⭐ */
  background-image: url("https://i.meee.com.tw/r17sw0F.png");

  background-size: contain;
  background-repeat: no-repeat;

  position: absolute;
  cursor: pointer;

  transition: transform 0.2s ease, opacity 0.3s ease;
}

.seed.removing {
  transform: scale(0.3);
  opacity: 0;
}

button {
  padding: 8px 16px;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>

<body>

<h2>討伐西瓜籽 🍉</h2>

<div id="melon"></div>

<p id="msg"></p>

<button onclick="startGame()">重新開始</button>

<script>
const melon = document.getElementById("melon");
const msg = document.getElementById("msg");

let total = 8;   // ⭐籽數量（可自己改）
let removed = 0;

/* ===== 隨機生成籽 ===== */
function startGame() {
  melon.innerHTML = "";
  removed = 0;
  msg.innerText = "";

  for (let i = 0; i < total; i++) {
    let seed = document.createElement("div");
    seed.className = "seed";

    // ⭐隨機位置（限制在西瓜內）
    let top, left;

do {
  top = Math.random() * (melonRect.height - seedHeight);
  left = Math.random() * (melonRect.width - seedWidth);

  // ⭐ 西瓜三角形限制（關鍵）
  // 越上面範圍越窄
  const centerX = melonRect.width / 2;
  const distanceFromCenter = Math.abs(left - centerX);

  // 允許寬度（越下面越寬）
  const maxWidth = (top / melonRect.height) * centerX;

} while (distanceFromCenter > maxWidth);

    seed.style.top = top + "px";
    seed.style.left = left + "px";

    seed.onclick = () => {
      seed.classList.add("removing");

      setTimeout(() => {
        seed.remove();
      }, 300);

      removed++;

      if (removed === total) {
        msg.innerText = "討伐完畢 ✔ 有舒服一點了嗎";
      }
    };

    melon.appendChild(seed);
  }
}

/* 初始啟動 */
startGame();
</script>

</body>
</html>
