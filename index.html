<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>討伐西瓜籽！</title>

<style>
body {
  text-align: center;
  font-family: sans-serif;
}

/* ===== 西瓜 ===== */
#melon {
  width: 320px;
  height: 220px;
  margin: 20px auto;
  position: relative;

  /* ⭐⭐⭐ 改這裡（西瓜圖）⭐⭐⭐ */
  background-image: url("https://i.meee.com.tw/8WJF4zu.png");

  background-size: cover;
  background-position: center;
  border-radius: 12px;

  overflow: hidden; /* 防止籽跑出去 */
}

/* ===== 籽 ===== */
.seed {
  width: 16px;
  height: 22px;

  /* ⭐⭐⭐ 改這裡（籽圖）⭐⭐⭐ */
  background-image: url("https://i.meee.com.tw/r17sw0F.png");

  background-size: contain;
  background-repeat: no-repeat;

  position: absolute;
  cursor: pointer;

  transition: transform 0.2s ease, opacity 0.3s ease;
}

.seed.removing {
  transform: scale(0.3);
  opacity: 0;
}

button {
  margin-top: 10px;
  padding: 8px 16px;
  font-size: 16px;
}
</style>
</head>

<body>

<h2>討伐西瓜籽！</h2>

<div id="melon"></div>

<p id="msg"></p>

<button onclick="startGame()">重新開始</button>

<script>
const melon = document.getElementById("melon");
const msg = document.getElementById("msg");

let total = 8;
let removed = 0;

/* ⭐ 安全範圍（避免跑出去） */
const PADDING = 20;

function startGame() {
  melon.innerHTML = "";
  msg.innerText = "";
  removed = 0;

  for (let i = 0; i < total; i++) {
    let seed = document.createElement("div");
    seed.className = "seed";

    /* ⭐ 隨機位置（限制在西瓜內） */
    let maxX = melon.clientWidth - 20 - PADDING;
    let maxY = melon.clientHeight - 25 - PADDING;

    let x = Math.random() * maxX + PADDING / 2;
    let y = Math.random() * maxY + PADDING / 2;

    seed.style.left = x + "px";
    seed.style.top = y + "px";

    seed.onclick = () => {
      seed.classList.add("removing");

      setTimeout(() => {
        seed.remove();
      }, 300);

      removed++;

      if (removed === total) {
        msg.innerText = "討伐完畢 ✔";
      }
    };

    melon.appendChild(seed);
  }
}

/* 一開始自動開始 */
startGame();
</script>

</body>
</html>
