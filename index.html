<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>討伐西瓜籽！</title>

<style>
body {
  text-align: center;
  font-family: sans-serif;
}

/* ===== 西瓜底圖 ===== */
#melon {
  width: 320px;
  height: 220px;
  margin: 20px auto;
  position: relative;

  /* ⭐⭐⭐ 這裡放你的「無籽西瓜圖片」 ⭐⭐⭐ */
  background-image: url("https://i.meee.com.tw/8WJF4zu.png");

  background-size: cover;
  background-position: center;
  border-radius: 12px;
  overflow: hidden;
}

/* ===== 籽（用圖片）===== */
.seed {
  width: 16px;
  height: 22px;

  /* ⭐⭐⭐ 這裡放「西瓜籽PNG（透明背景）」 ⭐⭐⭐ */
  background-image: url("https://i.meee.com.tw/r17sw0F.png");

  background-size: contain;
  background-repeat: no-repeat;

  position: absolute;
  cursor: pointer;

  transition: transform 0.2s ease, opacity 0.3s ease;
}

/* 點擊效果（比較像拿掉） */
.seed.removing {
  transform: scale(0.3);
  opacity: 0;
}
</style>
</head>

<body>

<h2>討伐西瓜籽！把所有西瓜籽挖出來吧！</h2>

<div id="melon"></div>
<p id="msg"></p>

<script>
const melon = document.getElementById("melon");
const msg = document.getElementById("msg");

/* ⭐ 控制籽數量（建議先少） */
let total = 5;
let removed = 0;

/* ⭐ 籽的位置（手動放，比亂數更穩） */
const positions = [
  {top: 60, left: 120},
  {top: 100, left: 200},
  {top: 140, left: 80},
  {top: 90, left: 160},
  {top: 130, left: 220}
];

positions.slice(0, total).forEach(pos => {
  let seed = document.createElement("div");
  seed.className = "seed";

  seed.style.top = pos.top + "px";
  seed.style.left = pos.left + "px";

  seed.onclick = () => {
    /* 加上「拿掉動畫」 */
    seed.classList.add("removing");

    setTimeout(() => {
      seed.remove();
    }, 300);

    removed++;

    if (removed === total) {
      msg.innerText = “討伐完畢 ✔ 不要再想了";
    }
  };

  melon.appendChild(seed);
});
</script>

</body>
</html>
